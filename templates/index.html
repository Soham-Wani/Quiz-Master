<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Master</title>
    <script>
        function showSignup() {
            document.getElementById("signin-form").style.display = "none";
            document.getElementById("signup-form").style.display = "flex";
            document.querySelector(".title").firstChild.textContent = "Create an Account!";
        }

        function showSignin() {
            document.getElementById("signup-form").style.display = "none";
            document.getElementById("signin-form").style.display = "flex";
            document.querySelector(".title").firstChild.textContent = "Welcome Back!";
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Poppins, serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #ff6600, #ffdbca);
        }

        .container {
            background: #fff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }

        .title {
            color: #ff6600;
            margin-bottom: 1rem;
        }

        .form-container {
            display: none;
            flex-direction: column;
            gap: 1rem;
        }

        label {
            display: none;
            text-align: left;
            font-weight: bold;
            color: #333;
        }

        .input-field {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 1rem;
        }

        .btn {
            background-color: #ff6600;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #b44800;
        }

        .link {
            color: #ff6600;
            text-decoration: none;
            font-weight: bold;
        }

        .link:hover {
            text-decoration: underline;
        }

        .error-message {
            color: red;
            font-weight: bold;
            margin-bottom: 1rem;
            background: rgba(255, 0, 0, 0.1);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        @media (max-width: 480px) {
            .container {
                width: 90%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h2 class="title">Welcome Back!</h2>

        {% if message %}
        <p class="error-message">{{ message }}</p>
        {% endif %}

        <div id="signin-form" class="form-container" style="display: flex;">
            <form method="POST" style="width: 100%;">
                <input type="hidden" name="action" value="signin">
                <label for="email">Email:</label>
                <input type="email" name="email" required class="input-field" placeholder="Enter your email">
                <label for="password">Password:</label>
                <input type="password" name="password" required class="input-field" placeholder="Enter your password">
                <button type="submit" class="btn">Sign in</button>
            </form>
            <p>Don't have an account? <a href="#" onclick="showSignup()" class="link">Sign Up</a></p>
        </div>

        <div id="signup-form" class="form-container">
            <form method="POST" style="width: 100%;">
                <input type="hidden" name="action" value="signup">
                <label for="username">Display Name:</label>
                <input type="text" name="username" required class="input-field" placeholder="Enter your display name">
                <label for="email">Email:</label>
                <input type="email" name="email" required class="input-field" placeholder="Enter your email">
                <label for="password">Password:</label>
                <input type="password" name="password" required class="input-field"
                    placeholder="Enter a strong password">
                <label for="dob">Date of Birth:</label>
                <input type="date" name="dob" required class="input-field" placeholder="Enter your date of birth">
                <button type="submit" class="btn">Sign Up</button>
            </form>
            <p>Already have an account? <a href="#" onclick="showSignin()" class="link">Sign In</a></p>
        </div>
    </div>
</body>

</html>
